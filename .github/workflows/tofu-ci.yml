name: OpenTofu Blueprints CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-opentofu-blueprints:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.6.2

    - name: Format & Validate AWS Kubernetes Blueprint
      run: |
        cd blueprints/aws-kubernetes
        tofu fmt -check
        tofu init -backend=false
        tofu validate

    - name: Format & Validate Azure Landing Zone Blueprint
      run: |
        cd blueprints/azure-landingzone
        tofu fmt -check
        tofu init -backend=false
        tofu validate
