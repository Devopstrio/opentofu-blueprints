name: OpenTofu Blueprints & Golang Engine CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-golang:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: false

    - name: Run Go Unit Test Suite
      run: |
        go mod tidy
        go test -v ./...

  verify-opentofu-hcl:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.6.2

    - name: Verify OpenTofu HCL Syntax
      run: |
        cd blueprints/aws-kubernetes
        tofu fmt -check
        tofu init -backend=false
        tofu validate
